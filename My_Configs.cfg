[temperature_sensor Host_CPU]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

sensor_type: temperature_host
min_temp: 10
max_temp: 100
[temperature_sensor toolhead]
sensor_type: temperature_mcu
sensor_mcu: THR
min_temp: 0
max_temp: 100

# ===========
# BED MESH
# ===========

[gcode_macro PROBE_BED]
description: Full bed mesh calibration
gcode:

    M118 START HEATING THE BED

    # Start heating bed while nozzle is being cleaned
    M140 S50

    BED_MESH_CLEAR

    SET_STEPPER_ENABLE STEPPER=extruder enable=0

    # Home only if required
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    M118 NOZZLE WIPE

    # Move to Qidi's nozzle cleaning area
    MOVE_TO_TRASH

    # Heat nozzle - NO FILAMENT IS EXTRUDED
    M109 S200

    # Qidi nozzle wipe movements
    M204 S5000

    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    # Qidi's second wipe area
    G1 X125 F15000
    G1 X130 Y280 F6000
    G1 Z-0.2 F600

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 X140 F200
    G1 Y281 F200
    G1 X130 F200
    G1 Y283 F200
    G1 X140 F200

    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600

    G1 Z0.2
    G1 X180 F12000
    G1 Z-1.5

    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000
    G1 X180 F12000
    G1 X164 F12000

    M400

    # Cool nozzle back to 140C
    M104 S140

    # Wait for bed to reach mesh temperature
    M190 S50

    M118 PROBE THE BED 9X9

    # Perform the KAMP bed mesh
    BED_MESH_CALIBRATE PROFILE=full_bed_9x9

    SAVE_VARIABLE VARIABLE=profile_name VALUE='"full_bed_9x9"'

    G4 P5000

    # Turn bed heater off
    M140 S0

    # Single beep
    BEEP DUR=200

    M104 S0

    G1 X135 Y135 Z10
    
    M118 FINISHED BED MESH

    SAVE_CONFIG_QD