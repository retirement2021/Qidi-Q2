    M204 S5000

    # First wipe / knock purge from nozzle
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    # Move to roller and wipe nozzle
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    M400

    M118  FILAMENT LOADED, 20mm PURGED

    RESPOND TYPE=command MSG="action:prompt_end"

