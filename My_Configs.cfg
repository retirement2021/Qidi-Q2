# ============================================================
# LOAD FILAMENT
# ============================================================

[gcode_macro LOAD_FILAMENT]

description: Load filament - choose filament type

gcode:

    BEEP DUR=200

    RESPOND TYPE=command MSG="action:prompt_begin FILAMENT LOAD"

    RESPOND TYPE=command MSG="action:prompt_text INSERT FILAMENT INTO THE EXTRUDER"

    RESPOND TYPE=command MSG="action:prompt_text CHOOSE FILAMENT TEMPERATURE"

    RESPOND TYPE=command MSG="action:prompt_show"

    RESPOND TYPE=command MSG="action:prompt_footer_button STD 20mm PURGE|LOAD_FILAMENT_SAME|primary"

    RESPOND TYPE=command MSG="action:prompt_footer_button STD 45mm |LOAD_FILAMENT_NEW|primary"
    
    RESPOND TYPE=command MSG="action:prompt_footer_button HOT 45mm PURGE|LOAD_FILAMENT_ASA_ABS|primary"  


# ============================================================
# LOAD SAME FILAMENT
# ============================================================

[gcode_macro LOAD_FILAMENT_SAME]

description: Load same filament

gcode:

    RESPOND TYPE=command MSG="action\:prompt_end"

    M118 LOADING SAME FILAMENT 20mm

    M104 S220

    MOVE_TO_TRASH

    M109 S220

    G92 E0

    G1 E20 F300

    M400

    M118 SAME FILAMENT LOADED AND 20mm PURGED

    BEEP DUR=100


# ============================================================
# LOAD NEW FILAMENT
# ============================================================

[gcode_macro LOAD_FILAMENT_NEW]

description: Load new filament

gcode:

    RESPOND TYPE=command MSG="action\:prompt_end"

    M118 LOADING NEW FILAMENT 45mm

    M104 S220

    MOVE_TO_TRASH

    M109 S220

    G92 E0

    G1 E45 F300

    M400

    M118 NEW FILAMENT LOADED AND 45mm PURGED

    BEEP DUR=100


# ============================================================
# LOAD ASA / ABS FILAMENT
# ============================================================

[gcode_macro LOAD_FILAMENT_ASA_ABS]

description: Load ASA or ABS filament at 250C

gcode:

    RESPOND TYPE=command MSG="action\:prompt_end"

    M118 LOADING ASA / ABS 45mm

    M104 S250

    MOVE_TO_TRASH

    M109 S250

    G92 E0

    G1 E45 F300

    M400

    M118 ASA / ABS LOADED AND 45mm PURGED

    BEEP DUR=100


# ============================================================
# UNLOAD FILAMENT
# ============================================================

[gcode_macro UNLOAD_FILAMENT]

description: Unload filament - choose filament type

gcode:

    BEEP DUR=300

    RESPOND TYPE=command MSG="action:prompt_begin FILAMENT UNLOAD"

    RESPOND TYPE=command MSG="action:prompt_text REMOVE THE PRINT FROM THE BUILD PLATE"

    RESPOND TYPE=command MSG="action:prompt_text CHOOSE FILAMENT TEMPERATURE"

    RESPOND TYPE=command MSG="action:prompt_footer_button STANDARD UNLOAD|UNLOAD_FILAMENT_CONTINUE|primary"

    RESPOND TYPE=command MSG="action:prompt_footer_button HOT UNLOAD|UNLOAD_FILAMENT_ASA_ABS|primary"

    RESPOND TYPE=command MSG="action:prompt_show"


# ============================================================
# STANDARD UNLOAD - 220C
# ============================================================

[gcode_macro UNLOAD_FILAMENT_CONTINUE]

description: Standard filament unload at 220C

gcode:

    # Close the Fluidd prompt
    RESPOND TYPE=command MSG="action\:prompt_end"

    M118 STARTING STANDARD FILAMENT UNLOAD

    # Home - the build plate must now be clear
    G28

    # Start heating nozzle
    M104 S220

    # Move directly to Qidi unload position
    MOVE_TO_TRASH

    # Wait for nozzle to reach temperature
    M109 S220

    M118 NOZZLE HOT - UNLOADING

    # Retract filament - NO extrusion
    G92 E0

    G1 E-60 F300

    M400

    # Turn nozzle heater off
    M104 S0

    # Quick nozzle wipe - NO extrusion
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    M400

    BEEP DUR=100

    M118 UNLOAD FINISHED

    SET_PRINT_MAIN_STATUS MAIN_STATUS=ready


# ============================================================
# ASA / ABS UNLOAD - 250C
# ============================================================

[gcode_macro UNLOAD_FILAMENT_ASA_ABS]

description: ASA or ABS filament unload at 250C

gcode:

    # Close the Fluidd prompt
    RESPOND TYPE=command MSG="action\:prompt_end"

    M118 STARTING ASA / ABS FILAMENT UNLOAD

    # Home - the build plate must now be clear
    G28

    # Start heating nozzle
    M104 S250

    # Move directly to Qidi unload position
    MOVE_TO_TRASH

    # Wait for nozzle to reach temperature
    M109 S250

    M118 NOZZLE HOT - UNLOADING ASA / ABS

    # Retract filament - NO extrusion
    G92 E0

    G1 E-60 F300

    M400

    # Turn nozzle heater off
    M104 S0

    # Quick nozzle wipe - NO extrusion
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    M400

    BEEP DUR=100

    M118 ASA / ABS UNLOAD FINISHED

    SET_PRINT_MAIN_STATUS MAIN_STATUS=ready


# =====================
# PID BED TUNING
#======================

[gcode_macro PID_BED]
description: PID Tune for the Bed, change "default temp" if required
gcode:
   
  {% set TARGET_TEMP = params.TARGET_TEMP|default(60)|float %}

  {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
    G28		                                            #
    {% endif %} 
                                            #
 
  PID_CALIBRATE HEATER=heater_bed TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS
  SAVE_CONFIG
  G4 P1000
  BEEP DUR=100
  M118 PID FINISHED

# =====================
# PID EXTRUDER TUNING
# =====================

[gcode_macro PID_EXTRUDER]
description: PID Tune for the Extruder, change "default temp" if required
gcode:
    

    {% set TARGET_TEMP = params.TARGET_TEMP|default(235)|float %}

  {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
    G28		                                            #
    {% endif %} 
                                           #
  PID_CALIBRATE HEATER=extruder TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS
  SAVE_CONFIG
  G4 P1000
  BEEP DUR=100
  M118 PID FINISHED

# =================
# PAUSE AT LAYER
# =================

[gcode_macro SET_CURRENT_LAYER]
description: Store the current print layer
variable_layer: 0
gcode:
    SET_GCODE_VARIABLE MACRO=SET_CURRENT_LAYER VARIABLE=layer VALUE={params.LAYER|int}


[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause at the start of the next layer
variable_enabled: 0
variable_target_layer: 0
gcode:
    {% set current = printer["gcode_macro SET_CURRENT_LAYER"].layer | int %}
    {% set enable = params.ENABLE | default(1) | int != 0 %}

    {% if enable %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=enabled VALUE=1
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=target_layer VALUE={current + 1}
        {action_respond_info("Pause enabled for next layer: %d" % (current + 1))}
    {% else %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=enabled VALUE=0
        {action_respond_info("Pause at next layer disabled")}
    {% endif %}


[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause at a specified layer
variable_enabled: 0
variable_target_layer: 0
gcode:
    {% if params.ENABLE is defined and params.ENABLE | int == 0 %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=enabled VALUE=0
        {action_respond_info("Pause at layer disabled")}
    {% elif params.LAYER is defined %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=enabled VALUE=1
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=target_layer VALUE={params.LAYER|int}
        {action_respond_info("Pause enabled for layer: %d" % (params.LAYER|int))}
    {% else %}
        {action_respond_info("Specify a layer, for example: SET_PAUSE_AT_LAYER LAYER=37")}
    {% endif %}


[gcode_macro _CHECK_LAYER_PAUSE]
description: Check whether the current layer should pause
gcode:
    {% set current = printer["gcode_macro SET_CURRENT_LAYER"].layer | int %}

    {% if printer["gcode_macro SET_PAUSE_AT_LAYER"].enabled | int and current == printer["gcode_macro SET_PAUSE_AT_LAYER"].target_layer | int %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_AT_LAYER VARIABLE=enabled VALUE=0
        PAUSE
        {action_respond_info("Paused at layer %d" % current)}
    {% endif %}

    {% if printer["gcode_macro SET_PAUSE_NEXT_LAYER"].enabled | int and current == printer["gcode_macro SET_PAUSE_NEXT_LAYER"].target_layer | int %}
        SET_GCODE_VARIABLE MACRO=SET_PAUSE_NEXT_LAYER VARIABLE=enabled VALUE=0
        PAUSE
        {action_respond_info("Paused at layer %d" % current)}
    {% endif %}


