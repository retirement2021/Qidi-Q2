# =====================
# SCREWS_TILT
# =====================

[gcode_macro SCREWS_TILT]
description: Heat, home, wipe nozzle and measure bed screws
gcode:
    M118 SCREWS TILT STARTING
     
    # Heat bed and wait
    M118 Heating bed to 50C...
    M140 S50 # start heating the bed

    # Home printer if required
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M118 Homing printer...
        G28
    {% endif %}
    
    # Move to Qidi trash / roller
    MOVE_TO_TRASH
    M400

    # Heat nozzle
    M118 Heating nozzle to 200C...
    M104 S200 # start heating
    M109 S200 # wait for temp
    G1 E-2 F600 # retract a little
    M104 S140 # lower heat to reduce oozing

    M118 Wiping nozzle...
    # First roller wipe section
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000
    G1 X103 F5000
    G1 X90 F5000

    # Second roller wipe section
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000
    G1 X114 F5000
    G1 X100 F5000

    M118 Nozzle wipe complete

    # Lift away from roller
    G1 Z10 F3000

    M190 S50 #Wait for bed temp

    M118 Starting screw tilt measurement...

    # Measure bed screw positions
    SCREWS_TILT_CALCULATE

    M118 SCREWS TILT COMPLETE

