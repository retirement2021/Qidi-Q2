# ============
# START PRINT
# ============

[gcode_macro PRINT_START]
gcode:
    AUTOTUNE_SHAPERS 
    DISABLE_ALL_SENSOR # turns off filament runout sensor
    CLEAR_PAUSE
    
    {% set bedtemp = params.get('BED') | int %}
    {% set hotendtemp = params.get('HOTEND') | int %}
    {% set chambertemp = params.get('CHAMBER', 0) | int %}
    {% set extruder = params.EXTRUDER|default(0)|int %}

    M140 S{bedtemp}  # start bed heating
    
    {% if "xyz" not in printer.toolhead.homed_axes %}   # home only if not already homed.
    G28
    {% endif %} 

    {% if chambertemp == 0 %} # my understanding, if the chamber heater in the slicer is set to 0 the extract fan is set to M106 P3
    M106 P3 S0              #  EXTRACT FAN: original M106 P3 S255(100%), possibilities: M106 P3 S85(33%) or S127(50%) or S170(66%)
    {% endif %}

    M141 S{chambertemp}  #chamber heater set in the slicer  
    SET_GCODE_OFFSET Z=0 MOVE=0
    {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] %} 
        SAVE_VARIABLE VARIABLE=load_retry_num VALUE=0
        SAVE_VARIABLE VARIABLE=retry_step VALUE=None
        {% for i in range(16) %}
            SAVE_VARIABLE VARIABLE=runout_{i} VALUE=0
            G4 P100
        {% endfor %}
        {% if printer.save_variables.variables.enable_box == 1 %}
            BOX_PRINT_START EXTRUDER={extruder} HOTENDTEMP={hotendtemp}
            M400
            EXTRUSION_AND_FLUSH HOTEND={hotendtemp}
        {% endif %}
    {% endif %}

    MY_CLEAR_NOZZLE HOTEND={hotendtemp} 
    
    M104 S150 # heat nozzle
    G4 P1000 # reduced pause
    M400 # finish above moves
                            
    Z_TILT_ADJUST # Qidi's Z tilt adjust

    M118 WAITING FOR TEMPERATURES
    M190 S{bedtemp}   
    M191 S{chambertemp}
    M400
    G4 P1000 # reduced pause
    
    BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE=ADAPTIVE PROBE_COUNT=7,7 

    M118 SMART PARK
    SMART_PARK                      
    G0 Z50 F600
    G0 X260 Y5  F30000
    {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] and printer.save_variables.variables.enable_box == 1 %}
        BUFFER_MONITORING ENABLE=1 
    {% endif %}
    M191 S{chambertemp}
    M109 S{hotendtemp}
    M204 S10000
   
    set_zoffset
    save_last_file

    LINE_PURGE  # KAMP's purge line

# ============================================================
# LOAD FILAMENT, Part-1. This is in 4 parts. you need all 4 of them
# ============================================================

[gcode_macro LOAD_FILAMENT]

description: Load filament - choose filament type

gcode:

    BEEP DUR=100

    RESPOND TYPE=command MSG="action:prompt_begin FILAMENT LOAD"

    RESPOND TYPE=command MSG="action:prompt_text INSERT FILAMENT INTO THE EXTRUDER"

    RESPOND TYPE=command MSG="action:prompt_text CHOOSE FILAMENT & PURGE LENGTH"

    RESPOND TYPE=command MSG="action:prompt_show"

    RESPOND TYPE=command MSG="action:prompt_footer_button PLA/PETG 20mm|LOAD_FILAMENT_PLA_PETG|primary"

    RESPOND TYPE=command MSG="action:prompt_footer_button PLA/PETG 45mm|LOAD_FILAMENT_PETG_PLA|primary"
    
    RESPOND TYPE=command MSG="action:prompt_footer_button ASA/ABS 45mm|LOAD_FILAMENT_ASA_ABS|primary"  


